# Meets the T026 policies: non-root, CPU and memory requests and limits, image from ghcr.io/rclaye/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  labels: { app.kubernetes.io/name: notifications }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: notifications }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notifications }
    spec:
      serviceAccountName: notifications
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: notifications
          image: ghcr.io/rclaye/sv-notifications:unset # the tag is set per overlay by the build workflow
          ports:
            - { name: http, containerPort: 8000 }
          env:
            - { name: SERVICE_NAME, value: notifications }
            - { name: JWT_AUDIENCE, value: notifications }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.monitoring:4318" }
            # Secret from Terraform; each overlay adds DATABASE_URL built from these two.
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: pg-notifications-app, key: username } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: pg-notifications-app, key: password } }
            - name: AMQP_URL
              # Placeholder until per-service RabbitMQ users exist (Messaging Topology Operator).
              valueFrom: { secretKeyRef: { name: notifications-amqp, key: url } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http } # not /healthz: a database outage must not restart the pod
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
