{% extends "base.html" %}
{% block title %}Order · {{ title }} · Sorted Vintage{% endblock %}
{% block content %}
<section class="order">
  <h1>{{ title }}</h1>
  <p class="price">${{ '%.2f' | format(order.amount_cents / 100) }}</p>
  {% include "_order_status.html" %}
  <p class="hint">Order reference {{ order.id }}</p>
  <p><a href="/items/{{ order.listing_id }}">View the listing</a> · <a href="/orders">Your orders</a></p>
</section>
{% endblock %}
