sonar.organization=rclaye
sonar.projectKey=rclaye_sv-bff
sonar.projectName=sv-bff
sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
# Browser assets are not covered by the Python tests: htmx is vendored, and checkout.js (T073) is
