# The build workflow (T029) rewrites newTag with the git SHA of the image it pushed.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sv-prod
resources:
  - ../../base
images:
  - name: ghcr.io/rclaye/sv-bff
    newTag: unset
replicas:
  - { name: bff, count: 2 }
patches:
  - target: { kind: Deployment, name: bff }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: ENV, value: prod }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: JWT_ISSUER, value: "https://auth.sortedvtg.lan:8443/realms/sv-prod" }
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: JWKS_URL, value: "http://keycloak-http.keycloak.svc.cluster.local/realms/sv-prod/protocol/openid-connect/certs" }
