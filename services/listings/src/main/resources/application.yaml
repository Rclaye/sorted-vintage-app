spring:
  application:
    name: listings
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

# Photos in Garage (research R19). The gitops Deployment sets the S3_* variables; the keys have no
# default, so a pod without them fails at startup rather than on the first upload.
listings:
  s3:
    endpoint: ${S3_ENDPOINT:http://garage:3900}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:photos}
    access-key-id: ${S3_ACCESS_KEY_ID}
    secret-access-key: ${S3_SECRET_ACCESS_KEY}
  payments:
    url: ${PAYMENTS_URL:http://payments}
  # Listings' own client-credentials token for Payments (T046): client listings in the realm,
  # secret from the Secret keycloak-clients (key listings). No default for the URL or secret.
  keycloak:
    token-url: ${KEYCLOAK_TOKEN_URL}
    client-id: ${KEYCLOAK_CLIENT_ID:listings}
    client-secret: ${KEYCLOAK_CLIENT_SECRET}

server:
  port: 8080
  shutdown: graceful
  tomcat:
    # Read the rest of an oversized upload before answering 413, so the client gets the answer
    # instead of a reset connection (Tomcat stops reading after 2 MB by default).
    max-swallow-size: 12MB

logging:
  structured:
    format:
      console: lab.sortedvintage.listings.logging.LabJsonFormatter

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus
      path-mapping:
        health: healthz
        prometheus: metrics
  endpoint:
    health:
      show-details: never
      status:
        http-mapping:
          DOWN: 503
          OUT_OF_SERVICE: 503
  observations:
    http:
      server:
        requests:
          name: http.server.request.duration
  metrics:
    distribution:
      percentiles-histogram:
        http.server.request.duration: true
