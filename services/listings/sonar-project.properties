sonar.organization=rclaye
sonar.projectKey=rclaye_sv-listings
sonar.projectName=sv-listings
sonar.sources=src/main
sonar.tests=src/test
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
sonar.java.source=21
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# FR-005 allows photos up to 10 MB, so the upload limits in application.yaml are deliberately above
# Sonar's 8 MiB threshold (S5693). They are the control itself, and the 413 photo_too_large rule is
# tested against that figure.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=*S5693
sonar.issue.ignore.multicriteria.e1.resourceKey=**/application.yaml
